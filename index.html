o estamos hablando.","sourcePage":2},{"id":"b007","kind":"prose","text":"Y si esto te parece impresionante, mi cori, créeme que todavía no tienes ni idea de todas las cosas que quiero hacer para sorprenderte.","sourcePage":2},{"id":"b008","kind":"prose","text":"Porque mientras diseñaba esta página, pensaba en algo que llevo tiempo queriendo demostrarte: que mi cariño por ti no se queda solamente en palabras. También se transforma en ideas, en proyectos, en horas dedicadas a crear algo que antes no existía.","sourcePage":2},{"id":"b009","kind":"prose","text":"Me gusta pensar que, de alguna manera, hay un parecido entre programar un videojuego y construir una historia contigo.","sourcePage":3},{"id":"b010","kind":"prose","text":"En ambos casos comienzo sin saber exactamente cómo terminará todo. Hay cosas que no funcionan a la primera, errores que debo comprender, detalles que necesito mejorar y momentos en los que debo volver al principio para descubrir qué hice mal.","sourcePage":3},{"id":"b011","kind":"prose","text":"Pero hay una diferencia.","sourcePage":3},{"id":"b012","kind":"prose","text":"Cuando creo un juego, puedo decidir cómo termina la historia.","sourcePage":3},{"id":"b013","kind":"prose","text":"Contigo no.","sourcePage":3},{"id":"b014","kind":"prose","text":"Porque esta historia no me pertenece solamente a mí.","sourcePage":3},{"id":"b015","kind":"prose","text":"Y quizás por eso significa tanto.","sourcePage":3},{"id":"b016","kind":"prose","text":"No hice esta página porque necesitara demostrarte que soy capaz de crear algo impresionante. La hice porque quería regalarte algo que no existiera en ninguna otra parte del mundo.","sourcePage":3},{"id":"b017","kind":"prose","text":"Algo que solo pudiera haber nacido porque un día te conocí.","sourcePage":3},{"id":"b018","kind":"prose","text":"Durante un tiempo dejé de hacer estas cosas. No porque se me hubieran acabado las ideas, ni porque hubiera dejado de sentir lo que sentía. Simplemente, ya no estábamos juntos. Y es extraño tener tantas cosas que entregar cuando no sabes si la otra persona todavía quiere recibirlas.","sourcePage":3},{"id":"b019","kind":"prose","text":"Pero ahora...","sourcePage":3},{"id":"b020","kind":"prose","text":"Ahora siento que estamos regresando a algún lugar.","sourcePage":3},{"id":"b021","kind":"prose","text":"No sé si podemos llamarlo volver. Tal vez todavía sea demasiado pronto. Quizás solo estamos acercándonos, con esa cautela de quienes conocen tanto la belleza como el peligro de abrir nuevamente una puerta.","sourcePage":4},{"id":"b022","kind":"prose","text":"Y, sin embargo, aquí estoy.","sourcePage":4},{"id":"b023","kind":"prose","text":"Construyendo algo para ti una vez más.","sourcePage":4},{"id":"b024","kind":"prose","text":"Como si todas esas ideas que había guardado estuvieran esperando pacientemente una nueva oportunidad de convertirse en realidad.","sourcePage":4},{"id":"b025","kind":"prose","text":"Hay algo que necesito confesarte.","sourcePage":5},{"id":"b026","kind":"prose","text":"Creo que todavía no estás preparada para volver a decirme «te amo».","sourcePage":5},{"id":"b027","kind":"prose","text":"Lo percibo en nuestras conversaciones, en esa manera nueva de acercarnos, en las palabras que elegimos y en las que, por alguna razón, evitamos pronunciar.","sourcePage":5},{"id":"b028","kind":"prose","text":"Y está bien.","sourcePage":5},{"id":"b029","kind":"prose","text":"No quiero que digas algo para lo que todavía no te sientes lista.","sourcePage":5},{"id":"b030","kind":"prose","text":"Por eso, cuando hablamos y llega ese momento de despedirnos o de expresarnos cariño, a veces sigo tu ritmo y te digo simplemente: «Te quiero».","sourcePage":5},{"id":"b031","kind":"prose","text":"Pero hay una pequeña mentira escondida en esas dos palabras.","sourcePage":5},{"id":"b032","kind":"prose","text":"Porque no es solamente eso.","sourcePage":5},{"id":"b033","kind":"prose","text":"Te amo.","sourcePage":5},{"id":"b034","kind":"prose","text":"Te amo.","sourcePage":5},{"id":"b035","kind":"prose","text":"Te amo.","sourcePage":5},{"id":"b036","kind":"prose","text":"Y podría repetirlo un millón de veces, aunque sospecho que ni siquiera entonces conseguiría explicar completamente lo que significa.","sourcePage":5},{"id":"b037","kind":"prose","text":"No es que «te quiero» sea insuficiente. Es que, cuando lo digo, siento que estoy intentando guardar algo inmenso en un espacio demasiado pequeño.","sourcePage":5},{"id":"b038","kind":"poetry","text":"Hay palabras que aprendieron a caminar,\\ny otras que nacieron para desbordarse.","sourcePage":6},{"id":"b039","kind":"poetry","text":"Yo intento hablarte con calma,\\nponerle límites a lo que siento,\\nhacer que mi voz no revele demasiado.","sourcePage":6},{"id":"b040","kind":"poetry","text":"Pero existe una parte de mí\\nque todavía pronuncia tu nombre\\ncon la inocencia de quien no sabe\\nque también se puede tener miedo\\nde aquello que más desea.","sourcePage":6},{"id":"b041","kind":"prose","text":"Quizás todavía nos falta aprender a convivir con nuestras diferencias. Con nuestras formas de pensar, de reaccionar, de entender el cariño.","sourcePage":6},{"id":"b042","kind":"prose","text":"No creo que amar a alguien signifique comprenderlo todo desde el principio.","sourcePage":6},{"id":"b043","kind":"prose","text":"De hecho, una de las cosas que más me gustan de ti es precisamente lo mucho que todavía desconozco.","sourcePage":6},{"id":"b044","kind":"prose","text":"Y no quiero apresurar ese descubrimiento.","sourcePage":6},{"id":"b045","kind":"prose","text":"Quiero que suceda con el tiempo, con conversaciones inesperadas, con desacuerdos pequeños, con preguntas que ninguno de los dos había pensado hacerse.","sourcePage":6},{"id":"b046","kind":"prose","text":"Quiero aprenderte.","sourcePage":6},{"id":"b047","kind":"prose","text":"No como quien memoriza un libro para repetirlo, sino como quien lo relee y descubre que una frase que antes parecía sencilla ahora significa algo completamente distinto.","sourcePage":6},{"id":"b048","kind":"prose","text":"Estos últimos dos días han sido, de alguna manera, los más felices que recuerdo de nosotros.","sourcePage":7},{"id":"b049","kind":"prose","text":"Y no necesariamente porque haya ocurrido algo extraordinario.","sourcePage":7},{"id":"b050","kind":"prose","text":"Han sido felices por algo mucho más difícil de explicar: la confianza que me has mostrado.","sourcePage":7},{"id":"b051","kind":"prose","text":"Sé que te dije que ahora me cuesta confiar en ti.","sourcePage":7},{"id":"b052","kind":"prose","text":"Y era verdad.","sourcePage":7},{"id":"b053","kind":"prose","text":"Todavía lo es.","sourcePage":7},{"id":"b054","kind":"prose","text":"Hay una contradicción dentro de mí que no he conseguido resolver. Una parte quiere creer cada cosa que me dices sin detenerse a pensar; la otra recuerda lo que ocurrió y hace preguntas incluso cuando preferiría permanecer en silencio.","sourcePage":7},{"id":"b055","kind":"prose","text":"A veces las dudas aparecen sin avisar.","sourcePage":7},{"id":"b056","kind":"prose","text":"Me pregunto si todo lo que me cuentas es verdad, si realmente sientes lo que dices, si esta vez estamos mirando hacia el mismo lugar.","sourcePage":7},{"id":"b057","kind":"prose","text":"Y entonces te escucho.","sourcePage":7},{"id":"b058","kind":"prose","text":"Observo cómo intentas acercarte, cómo me explicas lo que antes no entendía, cómo parece importante para ti que vuelva a creer.","sourcePage":7},{"id":"b059","kind":"prose","text":"Y quiero hacerlo.","sourcePage":7},{"id":"b060","kind":"prose","text":"Dios, cuánto quiero hacerlo.","sourcePage":7},{"id":"b061","kind":"prose","text":"Me gustaría decir que todas mis dudas son imaginarias, que no tienen ningún fundamento, que basta con cerrar los ojos para que desaparezcan.","sourcePage":7},{"id":"b062","kind":"prose","text":"Pero sería mentirme.","sourcePage":8},{"id":"b063","kind":"prose","text":"La confianza no funciona de esa manera.","sourcePage":8},{"id":"b064","kind":"prose","text":"No se recupera porque alguien la pida, ni siquiera porque dos personas se amen. Se reconstruye en esos pequeños instantes en los que una palabra coincide con una acción, en los que una promesa deja de ser una posibilidad y se convierte en algo real.","sourcePage":8},{"id":"b065","kind":"prose","text":"Y siento que estás intentando hacerlo.","sourcePage":8},{"id":"b066","kind":"prose","text":"Por eso quiero darte tiempo.","sourcePage":8},{"id":"b067","kind":"prose","text":"Darnos tiempo.","sourcePage":8},{"id":"b068","kind":"poetry","text":"No te pido que borres las preguntas\\nque quedaron entre nosotros.","sourcePage":8},{"id":"b069","kind":"poetry","text":"Quiero que llegue un día\\nen que ya no necesiten respuesta.","sourcePage":8},{"id":"b070","kind":"poetry","text":"Que la verdad se vuelva tan cotidiana\\ncomo preguntarnos si hemos comido,\\ncomo contarnos algo absurdo,\\ncomo reírnos de una tontería.","sourcePage":8},{"id":"b071","kind":"poetry","text":"Que confiar en ti\\ndeje de ser un acto de valentía\\ny vuelva a ser\\nuna forma tranquila de estar contigo.","sourcePage":8},{"id":"b072","kind":"prose","text":"¿Recuerdas algo que te dije una vez?","sourcePage":9},{"id":"b073","kind":"prose","text":"«Podría escribir un libro sobre ti, para que, si algún día se te olvida quién eres, puedas recordarlo».","sourcePage":9},{"id":"b074","kind":"prose","text":"No lo dije simplemente porque sonara bonito.","sourcePage":9},{"id":"b075","kind":"prose","text":"Lo decía en serio.","sourcePage":9},{"id":"b076","kind":"prose","text":"Hay personas a las que uno conoce y, después de un tiempo, cree haber comprendido. Aprende sus gustos, sus costumbres, las cosas que las hacen reír, y siente que ya tiene una idea bastante completa de quiénes son.","sourcePage":9},{"id":"b077","kind":"prose","text":"Contigo me ocurre algo diferente.","sourcePage":9},{"id":"b078","kind":"prose","text":"Cuanto más te conozco, más consciente soy de todo lo que todavía me falta descubrir.","sourcePage":9},{"id":"b079","kind":"prose","text":"Tienes gustos tan específicos que a veces me hacen sonreír. Expresiones que poco a poco he comenzado a reconocer como tuyas. Formas de reaccionar que me despiertan curiosidad. Detalles pequeños que, probablemente, tú ni siquiera consideras importantes.","sourcePage":9},{"id":"b080","kind":"prose","text":"Pero yo los observo.","sourcePage":9},{"id":"b081","kind":"prose","text":"Los recuerdo.","sourcePage":9},{"id":"b082","kind":"prose","text":"No porque quiera convertirte en alguien perfecto dentro de mi imaginación, sino porque me interesa la persona que existe detrás de cada una de esas cosas.","sourcePage":9},{"id":"b083","kind":"prose","text":"Me interesa cómo piensas.","sourcePage":9},{"id":"b084","kind":"prose","text":"Por qué algo te gusta tanto.","sourcePage":9},{"id":"b085","kind":"prose","text":"Qué significa para ti una palabra que para otros podría ser completamente normal.","sourcePage":10},{"id":"b086","kind":"prose","text":"Qué cosas te hacen sentir segura y cuáles te hacen alejarte.","sourcePage":10},{"id":"b087","kind":"prose","text":"Incluso me interesa aquello que todavía no sabes explicar de ti misma.","sourcePage":10},{"id":"b088","kind":"prose","text":"Y creo que esa curiosidad fue una de las primeras formas que tuvo mi amor de existir.","sourcePage":10},{"id":"b089","kind":"prose","text":"Antes de que supiera llamarlo amor.","sourcePage":10},{"id":"b090","kind":"prose","text":"Antes de que entendiera lo que estaba ocurriendo.","sourcePage":10},{"id":"b091","kind":"prose","text":"Porque hay algo particular en nuestra historia, ¿sabes?","sourcePage":10},{"id":"b092","kind":"prose","text":"Desde que nos conocimos, hablábamos como si estuviéramos creando una.","sourcePage":10},{"id":"b093","kind":"prose","text":"¿Lo recuerdas?","sourcePage":10},{"id":"b094","kind":"prose","text":"Era como si dos desconocidos hubieran comenzado a imaginar una vida hecha de palabras. Construíamos situaciones, inventábamos pequeñas historias y, de alguna manera, empezábamos a conocernos mientras fingíamos que ya nos conocíamos.","sourcePage":10},{"id":"b095","kind":"prose","text":"Me sigue pareciendo curioso.","sourcePage":10},{"id":"b096","kind":"prose","text":"Comenzamos inventando una historia sobre nosotros y terminamos teniendo una historia que contar.","sourcePage":10},{"id":"b097","kind":"prose","text":"No recuerdo el instante exacto en que ocurrió.","sourcePage":10},{"id":"b098","kind":"prose","text":"No hubo una fecha que pudiera señalar ni una frase que lo cambiara todo.","sourcePage":10},{"id":"b099","kind":"prose","text":"Simplemente, un día, aquello que estábamos construyendo dejó de parecerme un juego.","sourcePage":11},{"id":"b100","kind":"prose","text":"Empecé a prestar atención de otra manera.","sourcePage":11},{"id":"b101","kind":"prose","text":"A recordar cosas que habías dicho días antes. A descubrir que ciertos detalles tuyos se quedaban conmigo incluso después de terminar nuestras conversaciones.","sourcePage":11},{"id":"b102","kind":"prose","text":"Y cuando quise darme cuenta, ya estaba enamorado.","sourcePage":11},{"id":"b103","kind":"poetry","text":"Primero inventamos un nosotros,\\ncomo quien dibuja una casa\\nsin pensar que algún día vivirá en ella.","sourcePage":11},{"id":"b104","kind":"poetry","text":"Le pusimos palabras a las ventanas,\\nrisas a las habitaciones,\\npreguntas a las puertas.","sourcePage":11},{"id":"b105","kind":"poetry","text":"Y en algún momento,\\nsin que ninguno anunciara su llegada,\\nel amor entró.","sourcePage":11},{"id":"b106","kind":"poetry","text":"No sé cuál de los dos dejó abierto.","sourcePage":11},{"id":"b107","kind":"poetry","text":"Solo recuerdo\\nque después de aquello\\nya no imaginaba la casa vacía.","sourcePage":11},{"id":"b108","kind":"prose","text":"A veces pienso que enamorarme de ti ha sido una forma extraña de intentar descifrar una historia.","sourcePage":12},{"id":"b109","kind":"prose","text":"Cada cosa que dices parece añadir una página. Cada conversación modifica algo que creía haber entendido. Incluso los momentos difíciles tienen una importancia que todavía no sé cómo interpretar.","sourcePage":12},{"id":"b110","kind":"prose","text":"Y quizás eso es lo que más me asusta.","sourcePage":12},{"id":"b111","kind":"prose","text":"Que algo tan hermoso también pueda ser tan incierto.","sourcePage":12},{"id":"b112","kind":"prose","text":"Cuando decidiste alejarte de mí, hubo cosas que no supe manejar.","sourcePage":12},{"id":"b113","kind":"prose","text":"Me dolió.","sourcePage":12},{"id":"b114","kind":"prose","text":"Me confundí.","sourcePage":12},{"id":"b115","kind":"prose","text":"Dije palabras feas que ahora reconozco como parte de una reacción que no me enorgullece.","sourcePage":12},{"id":"b116","kind":"prose","text":"No quiero justificar esas palabras por lo que sentía. El dolor puede explicar una reacción, pero no convierte automáticamente esa reacción en correcta.","sourcePage":12},{"id":"b117","kind":"prose","text":"Aun así, tú intentaste entenderme.","sourcePage":12},{"id":"b118","kind":"prose","text":"Comprendiste que detrás de algunas de esas cosas había alguien que estaba sufriendo y que no sabía cómo expresar lo que le ocurría.","sourcePage":12},{"id":"b119","kind":"prose","text":"Y ahora soy yo quien intenta comprenderte a ti.","sourcePage":12},{"id":"b120","kind":"prose","text":"Comprender por qué decidiste separarte, por qué dijiste ciertas cosas, por qué ahora quieres que vuelva a confiar.","sourcePage":12},{"id":"b121","kind":"prose","text":"Cuando me explicaste lo que sentías, algo dentro de mí quiso descansar.","sourcePage":13},{"id":"b122","kind":"prose","text":"Quiso creer que aquello que había interpretado como un final quizás no era exactamente lo que parecía.","sourcePage":13},{"id":"b123","kind":"prose","text":"No sé si estamos comenzando de nuevo o continuando algo que nunca terminó por completo.","sourcePage":13},{"id":"b124","kind":"prose","text":"Solo sé que me gustaría descubrirlo contigo.","sourcePage":13},{"id":"b125","kind":"prose","text":"Hay algo que me hizo pensar especialmente en todo esto.","sourcePage":13},{"id":"b126","kind":"prose","text":"Una vez dijiste que valía la pena estar conmigo.","sourcePage":13},{"id":"b127","kind":"prose","text":"He recordado esas palabras.","sourcePage":13},{"id":"b128","kind":"prose","text":"Y creo que este libro es, en cierto modo, mi respuesta.","sourcePage":13},{"id":"b129","kind":"prose","text":"No porque estas páginas puedan demostrar que tengo razón, ni porque escribir algo hermoso garantice que seremos felices.","sourcePage":13},{"id":"b130","kind":"prose","text":"Sino porque quiero que veas la seriedad con la que me tomo algo que, desde fuera, podría parecer tan sencillo como enamorarse.","sourcePage":13},{"id":"b131","kind":"prose","text":"Yo quiero una relación sana contigo.","sourcePage":13},{"id":"b132","kind":"prose","text":"Quiero que puedas contarme cualquier cosa sin sentir que voy a juzgarte. Que no tengas que ensayar tus palabras antes de hablarme. Que puedas decirme incluso aquello que sabes que quizás no me gustará escuchar.","sourcePage":13},{"id":"b133","kind":"prose","text":"Quiero que te sientas segura.","sourcePage":13},{"id":"b134","kind":"prose","text":"No porque yo tenga todas las respuestas, sino porque quiero aprender a escucharte incluso cuando no las tengo.","sourcePage":13},{"id":"b135","kind":"prose","text":"Quiero que sepas que puedes confiar en alguien sin tener que fingir que todo está bien.","sourcePage":14},{"id":"b136","kind":"prose","text":"Y también quiero sentir eso contigo.","sourcePage":14},{"id":"b137","kind":"prose","text":"Poder mostrarte mis inseguridades sin convertirlas en acusaciones. Hablar de mis temores sin hacerte responsable de resolverlos todos.","sourcePage":14},{"id":"b138","kind":"prose","text":"Tal vez ese sea uno de nuestros aprendizajes pendientes: entender que dos personas pueden amarse profundamente y, aun así, necesitar aprender a tratarse mejor.","sourcePage":14},{"id":"b139","kind":"prose","text":"A mí me apasiona comprenderte.","sourcePage":14},{"id":"b140","kind":"prose","text":"Lo digo de una forma casi literal.","sourcePage":14},{"id":"b141","kind":"prose","text":"Es como una vocación que nadie me enseñó a tener. Como un oficio al que dedico mis pensamientos sin darme cuenta.","sourcePage":14},{"id":"b142","kind":"prose","text":"A veces bromeo diciendo que estoy obsesionado contigo.","sourcePage":14},{"id":"b143","kind":"prose","text":"Y quizás hay algo de verdad en esa expresión, aunque no quiero que la confundas con querer poseerte ni hacer de ti todo mi mundo.","sourcePage":14},{"id":"b144","kind":"prose","text":"Lo que me ocurre es que, cuando algo me importa profundamente, deseo conocerlo, cuidarlo y encontrar maneras de hacerlo mejor.","sourcePage":14},{"id":"b145","kind":"prose","text":"Y contigo ese deseo adquiere una intensidad que nunca había sabido explicar.","sourcePage":14},{"id":"b146","kind":"prose","text":"No quiero cambiarte para convertirte en la persona que yo imagino.","sourcePage":14},{"id":"b147","kind":"prose","text":"Quiero seguir descubriendo a la persona que ya eres.","sourcePage":14},{"id":"b148","kind":"prose","text":"Porque eres hermosa.","sourcePage":15},{"id":"b149","kind":"prose","text":"Y me gusta decírtelo, aunque probablemente pienses que exagero.","sourcePage":15},{"id":"b150","kind":"prose","text":"Recuerdo que alguna vez intenté convencerte de algo que para mí era evidente: que solo tenías que creer un poco más en ti misma para comprender lo hermosa que eres.","sourcePage":15},{"id":"b151","kind":"prose","text":"Y ahora siento que empiezas a verlo.","sourcePage":15},{"id":"b152","kind":"prose","text":"También eres inteligente. Muchísimo.","sourcePage":15},{"id":"b153","kind":"prose","text":"Pero hay una inteligencia tuya que me llama especialmente la atención y que no tiene que ver con cuánto sabes.","sourcePage":15},{"id":"b154","kind":"prose","text":"Tiene que ver con la manera en que intentas comprender las emociones.","sourcePage":15},{"id":"b155","kind":"prose","text":"Con cómo pudiste reconocer que mis palabras, incluso cuando fueron desagradables, venían de un lugar más complejo que la simple intención de herirte.","sourcePage":15},{"id":"b156","kind":"prose","text":"Eso no significa que siempre tengas razón ni que nunca te equivoques.","sourcePage":15},{"id":"b157","kind":"prose","text":"Significa que hay en ti una sensibilidad que admiro.","sourcePage":15},{"id":"b158","kind":"prose","text":"Y quiero conocerla mejor.","sourcePage":15},{"id":"b159","kind":"prose","text":"Hay otro detalle pequeño que probablemente te haga reír cuando lo leas.","sourcePage":16},{"id":"b160","kind":"prose","text":"Los emojis.","sourcePage":16},{"id":"b161","kind":"prose","text":"Sí, los emojis.","sourcePage":16},{"id":"b162","kind":"prose","text":"Antes de ti, no les daba la misma importancia. Pero poco a poco comenzaste a contagiarme tu manera de utilizarlos, de llenar nuestras conversaciones de pequeñas expresiones que terminaban diciendo cosas que las palabras no alcanzaban a explicar.","sourcePage":16},{"id":"b163","kind":"prose","text":"Hasta que se volvieron parte de nosotros.","sourcePage":16},{"id":"b164","kind":"prose","text":"Cuando volvimos a hablar, noté que ya no los usaba de la misma manera.","sourcePage":16},{"id":"b165","kind":"prose","text":"Y me resultó extraño.","sourcePage":16},{"id":"b166","kind":"prose","text":"Era algo absurdo, casi insignificante, pero sentía que faltaba algo.","sourcePage":16},{"id":"b167","kind":"prose","text":"Como si nuestras conversaciones siguieran teniendo las mismas letras, pero hubieran perdido parte de su acento.","sourcePage":16},{"id":"b168","kind":"prose","text":"Pensaba que quizás la magia se había terminado.","sourcePage":16},{"id":"b169","kind":"prose","text":"Que aquello que habíamos tenido existía ahora solamente en mi memoria y que estaba intentando encontrarlo en conversaciones nuevas.","sourcePage":16},{"id":"b170","kind":"prose","text":"Pero había una pregunta que me acompañaba.","sourcePage":16},{"id":"b171","kind":"prose","text":"¿Y si todavía quedaba algo?","sourcePage":16},{"id":"b172","kind":"prose","text":"¿Y si, en algún lugar de tu corazón, lo que habías dicho sobre dejar de sentir cosas por mí no contaba toda la historia?","sourcePage":16},{"id":"b173","kind":"prose","text":"Sé que era una esperanza mía.","sourcePage":17},{"id":"b174","kind":"prose","text":"Y que desear algo con mucha fuerza no significa que sea verdad.","sourcePage":17},{"id":"b175","kind":"prose","text":"Pero cuando me explicaste lo que había ocurrido, cuando comenzamos a acercarnos de nuevo, sentí que esa posibilidad dejaba de existir solamente en mi imaginación.","sourcePage":17},{"id":"b176","kind":"prose","text":"No sé cuánto de lo que éramos podremos recuperar.","sourcePage":17},{"id":"b177","kind":"prose","text":"Y tal vez tampoco se trate de recuperar exactamente lo mismo.","sourcePage":17},{"id":"b178","kind":"prose","text":"Quizás lo más hermoso sería construir algo distinto, con las mismas dos personas, pero un poco más conscientes de lo que pueden hacerse sentir.","sourcePage":17},{"id":"b179","kind":"poetry","text":"Qué extraño es el amor:\\na veces sobrevive en cosas diminutas.","sourcePage":17},{"id":"b180","kind":"poetry","text":"En un símbolo que dejamos de enviar,\\nen una palabra que cambiamos por otra,\\nen la manera de decir buenas noches.","sourcePage":17},{"id":"b181","kind":"poetry","text":"Uno cree que recuerda grandes momentos,\\npero la memoria guarda también\\nesas pequeñas costumbres\\nque nadie nos enseñó a extrañar.","sourcePage":17},{"id":"b182","kind":"poetry","text":"Y entonces comprendes\\nque amar a alguien\\ntambién es aprender un idioma\\nque solo existe cuando ambos lo hablan.","sourcePage":17},{"id":"b183","kind":"prose","text":"Quiero ir a tu país.","sourcePage":18},{"id":"b184","kind":"prose","text":"Quiero verte.","sourcePage":18},{"id":"b185","kind":"prose","text":"Y no me refiero únicamente a ese momento extraordinario de encontrarnos por primera vez, aunque pensarlo todavía me produce una felicidad difícil de disimular.","sourcePage":18},{"id":"b186","kind":"prose","text":"Me refiero también a las cosas normales.","sourcePage":18},{"id":"b187","kind":"prose","text":"Quiero saber cómo es tu sonrisa cuando no depende de una pantalla. Cómo cambia tu expresión cuando algo te da vergüenza. Cómo es escucharte reír sin que exista una distancia entre tu voz y mis oídos.","sourcePage":18},{"id":"b188","kind":"prose","text":"Quiero conocer esos detalles que ninguna llamada puede mostrar completamente.","sourcePage":18},{"id":"b189","kind":"prose","text":"Caminar contigo.","sourcePage":18},{"id":"b190","kind":"prose","text":"Escucharte hablar de cualquier cosa.","sourcePage":18},{"id":"b191","kind":"prose","text":"Encontrar maneras de hacerte sonreír, incluso en los días en que no ocurra nada especial.","sourcePage":18},{"id":"b192","kind":"prose","text":"Porque no sueño únicamente con los momentos extraordinarios que podríamos vivir.","sourcePage":18},{"id":"b193","kind":"prose","text":"También sueño con los días comunes.","sourcePage":18},{"id":"b194","kind":"prose","text":"Con descubrir cómo somos cuando la emoción del reencuentro se convierte poco a poco en la tranquilidad de la compañía.","sourcePage":18},{"id":"b195","kind":"prose","text":"Y sé que eso también puede ser difícil.","sourcePage":18},{"id":"b196","kind":"prose","text":"Que estar juntos de verdad implica aprender cosas que la distancia todavía nos permite desconocer.","sourcePage":18},{"id":"b197","kind":"prose","text":"Habrá diferencias.","sourcePage":19},{"id":"b198","kind":"prose","text":"Habrá días en que no sepamos qué decir.","sourcePage":19},{"id":"b199","kind":"prose","text":"Momentos en que ninguno de los dos tenga razón y debamos encontrar una manera de entendernos sin hacernos daño.","sourcePage":19},{"id":"b200","kind":"prose","text":"No quiero prometerte una felicidad perfecta.","sourcePage":19},{"id":"b201","kind":"prose","text":"Sería una promesa demasiado sencilla de escribir y demasiado imposible de cumplir.","sourcePage":19},{"id":"b202","kind":"prose","text":"Pero sí quiero prometerte algo que depende de mí: intentar construir una relación en la que no tengamos que elegir entre amar y sentirnos en paz.","sourcePage":19},{"id":"b203","kind":"prose","text":"Una relación en la que podamos equivocarnos, reconocerlo y seguir aprendiendo.","sourcePage":19},{"id":"b204","kind":"prose","text":"En la que la confianza no sea una obligación, sino una consecuencia de cómo nos tratamos.","sourcePage":19},{"id":"b205","kind":"prose","text":"En la que nunca dejemos de sentir curiosidad por la persona que tenemos al lado.","sourcePage":19},{"id":"b206","kind":"prose","text":"Y, sobre todo, en la que seguir juntos sea una decisión que podamos tomar libremente, tantas veces como haga falta.","sourcePage":19},{"id":"b207","kind":"prose","text":"Ahora quiero preguntarte algo.","sourcePage":20},{"id":"b208","kind":"prose","text":"Pero antes necesito que comprendas por qué hice todo esto.","sourcePage":20},{"id":"b209","kind":"prose","text":"No escribí estas páginas para convencerte de que debes estar conmigo.","sourcePage":20},{"id":"b210","kind":"prose","text":"Tampoco para que te sientas obligada a responderme con palabras tan grandes como las mías.","sourcePage":20},{"id":"b211","kind":"prose","text":"Las escribí porque hace tiempo te dije que podía escribir un libro sobre ti, y descubrí que aquella promesa era más seria de lo que parecía.","sourcePage":20},{"id":"b212","kind":"prose","text":"Porque quería que tuvieras un lugar al que regresar si alguna vez olvidabas cómo te veo.","sourcePage":20},{"id":"b213","kind":"prose","text":"Un lugar donde pudieras encontrar todas esas cosas que admiro de ti, incluso las que todavía no sabes que me encantan.","sourcePage":20},{"id":"b214","kind":"prose","text":"Y también porque necesito que sepas lo que ocurre dentro de mí.","sourcePage":20},{"id":"b215","kind":"prose","text":"Que, detrás de mis bromas, mis dudas, mis preguntas y mis intentos de sorprenderte, hay alguien que te ama de una manera muy sincera.","sourcePage":20},{"id":"b216","kind":"prose","text":"Alguien que todavía tiene miedo.","sourcePage":20},{"id":"b217","kind":"prose","text":"Alguien que está intentando confiar otra vez.","sourcePage":20},{"id":"b218","kind":"prose","text":"Alguien que, a pesar de todo, sigue imaginando un futuro en el que ambos podamos ser felices.","sourcePage":20},{"id":"b219","kind":"prose","text":"Cuando terminamos una conversación, muchas veces me quedo pensando en lo que dijiste. En algo que podría haberte preguntado. En una manera diferente de expresar lo que siento.","sourcePage":20},{"id":"b220","kind":"prose","text":"Y creo que eso dice bastante sobre lo que significas para mí.","sourcePage":21},{"id":"b221","kind":"prose","text":"No quiero buscar a otra persona a la que comprender de esta manera.","sourcePage":21},{"id":"b222","kind":"prose","text":"No porque crea que no exista nadie más en el mundo, sino porque, entre todas las historias que podrían comenzar, es esta la que deseo seguir escribiendo.","sourcePage":21},{"id":"b223","kind":"prose","text":"La nuestra.","sourcePage":21},{"id":"b224","kind":"prose","text":"Con sus páginas hermosas.","sourcePage":21},{"id":"b225","kind":"prose","text":"Con sus errores.","sourcePage":21},{"id":"b226","kind":"prose","text":"Con esas partes que todavía nos cuesta leer sin sentir algo de tristeza.","sourcePage":21},{"id":"b227","kind":"prose","text":"Y con las páginas en blanco que ninguno de los dos sabe cómo terminarán.","sourcePage":21},{"id":"b228","kind":"prose","text":"Porque al final, por mucho que yo escriba, hay algo que nunca podré decidir solo.","sourcePage":21},{"id":"b229","kind":"prose","text":"Esta historia nos pertenece a los dos.","sourcePage":21},{"id":"b230","kind":"prose","text":"Yo puedo llenar estas páginas de palabras, convertir mis sentimientos en poemas, inventar mil maneras de sorprenderte y aprender cosas nuevas con la esperanza de verte sonreír.","sourcePage":21},{"id":"b231","kind":"prose","text":"Pero no puedo escribir tu parte.","sourcePage":21},{"id":"b232","kind":"prose","text":"Esa te pertenece a ti.","sourcePage":21},{"id":"b233","kind":"prose","text":"Y quizás ahí se encuentre lo más hermoso y lo más aterrador de amar: entregar una parte de lo que somos sin conocer de antemano qué hará la otra persona con ella.","sourcePage":21},{"id":"b234","kind":"prose","text":"Así que quiero hacerte una pregunta.","sourcePage":22},{"id":"b235","kind":"prose","text":"Una pregunta que parece sencilla, pero que contiene todo lo que he intentado decirte.","sourcePage":22},{"id":"b236","kind":"prose","text":"¿Crees que vale la pena seguir escribiendo esta historia conmigo?","sourcePage":22},{"id":"b237","kind":"prose","text":"No tienes que responderla ahora.","sourcePage":22},{"id":"b238","kind":"prose","text":"Tampoco necesitas decirme «te amo» antes de estar preparada.","sourcePage":22},{"id":"b239","kind":"prose","text":"Me gustaría que, si algún día vuelves a pronunciar esas palabras, sea porque ya no tengas que preguntarte si realmente las sientes.","sourcePage":22},{"id":"b240","kind":"prose","text":"Mientras tanto, quiero conocerte.","sourcePage":22},{"id":"b241","kind":"prose","text":"Quiero escucharte.","sourcePage":22},{"id":"b242","kind":"prose","text":"Quiero recuperar tu confianza y aprender a entregarte la mía.","sourcePage":22},{"id":"b243","kind":"prose","text":"Quiero viajar a tu país, mirarte a los ojos y descubrir cuántas de las cosas que hemos imaginado se parecen a la realidad.","sourcePage":22},{"id":"b244","kind":"prose","text":"Y quiero que, cuando termines de leer este libro, sonrías al pensar en lo increíblemente enamorado que está de ti el hombre que lo escribió.","sourcePage":22},{"id":"b245","kind":"prose","text":"Porque sí, mi cori.","sourcePage":22},{"id":"b246","kind":"prose","text":"Estoy loco por ti.","sourcePage":22},{"id":"b247","kind":"prose","text":"Aunque quizás no de la manera que imaginamos cuando hablamos de estar locos de amor.","sourcePage":22},{"id":"b248","kind":"prose","text":"Mi locura consiste en seguir encontrando algo extraordinario en tus detalles más sencillos. En querer aprender cosas solamente para sorprenderte. En recordar conversaciones que probablemente tú ya olvidaste. En sentir que dos días de confianza pueden significar más que meses enteros de palabras bonitas.","sourcePage":22},{"id":"b249","kind":"prose","text":"Y en estar aquí, otra vez, dispuesto a intentarlo.","sourcePage":23},{"id":"b250","kind":"prose","text":"No sé si algún día escribiré un libro completo sobre ti.","sourcePage":23},{"id":"b251","kind":"prose","text":"Quizás este sea solamente el primero.","sourcePage":23},{"id":"b252","kind":"prose","text":"Quizás llenemos juntos cientos de páginas, o quizás la vida termine llevándonos por caminos que ahora no podemos imaginar.","sourcePage":23},{"id":"b253","kind":"prose","text":"Lo único que sé es que, si algún día llegas a olvidar quién eres y decides regresar a estas palabras, quisiera que encontraras algo más que la descripción de una mujer amada.","sourcePage":23},{"id":"b254","kind":"prose","text":"Quisiera que encontraras el testimonio de alguien que intentó verte de verdad.","sourcePage":23},{"id":"b255","kind":"prose","text":"Con tus dudas, con tus contradicciones, con tus errores, con esa manera tan tuya de existir.","sourcePage":23},{"id":"b256","kind":"prose","text":"Y que, aun sin comprenderte por completo, quiso seguir conociéndote.","sourcePage":23},{"id":"b257","kind":"prose","text":"Porque he descubierto algo mientras escribía.","sourcePage":23},{"id":"b258","kind":"prose","text":"Al principio pensé que estaba haciendo un libro para que tú nunca olvidaras quién eres.","sourcePage":23},{"id":"b259","kind":"prose","text":"Pero ahora comprendo que también lo estoy escribiendo para recordar quién soy yo cuando estoy contigo.","sourcePage":23},{"id":"b260","kind":"prose","text":"Y hay una última cosa que quiero decirte.","sourcePage":23},{"id":"b261","kind":"prose","text":"Si decides quedarte, no te prometo escribir una historia perfecta. Te prometo algo que para mí vale mucho más: no olvidar nunca que, detrás de cada página, existe una persona real a la que debo aprender a amar también fuera de las palabras.","sourcePage":24},{"id":"b262","kind":"prose","text":"Porque un libro puede conservar nuestros recuerdos.","sourcePage":24},{"id":"b263","kind":"prose","text":"Puede guardar nuestras promesas, nuestras confesiones y hasta las cosas que alguna vez nos dio miedo decir.","sourcePage":24},{"id":"b264","kind":"prose","text":"Pero hay algo que ningún libro puede hacer por nosotros.","sourcePage":24},{"id":"b265","kind":"prose","text":"Vivir lo que todavía nos falta.","sourcePage":24},{"id":"b266","kind":"prose","text":"Y yo, mi cori...","sourcePage":24},{"id":"b267","kind":"prose","text":"Yo todavía quiero vivirlo contigo.","sourcePage":24}]'),id={blocks:X0};function Z0(D,$,w,h){const B=document.createElement("div");B.className="page-copy",Object.assign(B.style,{position:"fixed",left:"-20000px",top:"0",width:`${$}px`,fontSize:`${h}px`,visibility:"hidden"}),document.body.append(B);const X=[];let ae=[];const oe=O=>{const b=document.createElement("p");return b.className=O.kind,b.textContent=O.text,b};for(const O of D)B.append(oe(O)),B.getBoundingClientRect().height>w&&ae.length&&(X.push(ae),ae=[],B.replaceChildren(oe(O))),ae.push(O);if(ae.length&&X.push(ae),X.length>1){const O=X[X.length-2],b=X[X.length-1],N=Q=>(B.replaceChildren(...Q.map(oe)),B.getBoundingClientRect().height);for(;O.length>1;){const Q=N(O),I=N(b),te=[O[O.length-1]
